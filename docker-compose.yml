name: kagex

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  BACKEND_HOST: 0.0.0.0
  BACKEND_PORT: 8000
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:5173"]}
  PROJECT_STORAGE_ROOT: /app/storage
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
  MAX_EXTRACTED_SIZE_MB: ${MAX_EXTRACTED_SIZE_MB:-100}
  MAX_ARCHIVE_FILES: ${MAX_ARCHIVE_FILES:-2000}
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
  MAX_COMPRESSION_RATIO: ${MAX_COMPRESSION_RATIO:-100}
  INGESTION_TIMEOUT_SECONDS: ${INGESTION_TIMEOUT_SECONDS:-30}
  ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-120}
  ANALYZER_TIMEOUT_SECONDS: ${ANALYZER_TIMEOUT_SECONDS:-45}
  ANALYSIS_QUEUE_TIMEOUT_SECONDS: ${ANALYSIS_QUEUE_TIMEOUT_SECONDS:-600}
  MAX_ANALYSIS_FILE_BYTES: ${MAX_ANALYSIS_FILE_BYTES:-524288}
  MAX_ANALYSIS_ENTITIES: ${MAX_ANALYSIS_ENTITIES:-10000}
  MAX_ANALYZER_OUTPUT_BYTES: ${MAX_ANALYZER_OUTPUT_BYTES:-8388608}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kagex}:${POSTGRES_PASSWORD:-kagex_dev_only}@postgres:5432/${POSTGRES_DB:-kagex}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kagex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kagex_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-kagex}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ./backend, target: api }
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    build: { context: ./backend, target: api }
    environment: *backend-environment
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    volumes: ["./backend/app:/app/app:ro,Z", "source_data:/app/storage"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    build: { context: ./backend, target: worker }
    environment: *backend-environment
    volumes: ["source_data:/app/storage:ro"]
    mem_limit: 2g
    pids_limit: 128
    tmpfs: ["/tmp:size=512m,mode=1777"]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=worker@%h"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 3"]
      interval: 10s
      timeout: 8s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["127.0.0.1:5173:5173"]
    volumes: ["./frontend/src:/app/src:ro,Z"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10

volumes:
  postgres_data:
  source_data:
