name: kagex

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  BACKEND_HOST: 0.0.0.0
  BACKEND_PORT: 8000
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:5173"]}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kagex}:${POSTGRES_PASSWORD:-kagex_dev_only}@postgres:5432/${POSTGRES_DB:-kagex}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kagex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kagex_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-kagex}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    build: ./backend
    environment: *backend-environment
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    volumes: ["./backend/app:/app/app:ro,Z"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    build: ./backend
    environment: *backend-environment
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=worker@%h"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 3"]
      interval: 10s
      timeout: 8s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["127.0.0.1:5173:5173"]
    volumes: ["./frontend/src:/app/src:ro,Z"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10

volumes:
  postgres_data:
