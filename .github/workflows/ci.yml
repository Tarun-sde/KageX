name: KageX checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kagex
          POSTGRES_PASSWORD: kagex_ci_only
          POSTGRES_DB: kagex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kagex -d kagex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kagex:kagex_ci_only@localhost:5432/kagex_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --python 3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --prefix app/analyzers/tools
      - run: uv run python app/analyzers/tools/install_ck.py
      - run: |
          echo "ANALYZER_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "ANALYZER_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/health && curl --fail http://localhost:8000/ready && curl --fail http://localhost:5173/ > /dev/null
      - run: docker compose exec -T backend python -c "from app.workers.celery_app import ping; assert ping.delay().get(timeout=20) == 'pong'"
      - run: docker compose exec -T backend alembic check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose down
